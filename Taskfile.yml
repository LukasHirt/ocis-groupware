version: "3"

vars:
  IMAGE: ocis-groupware:dev

tasks:
  build:
    desc: Build the ocis-groupware binary
    cmds:
      - go build ./...

  run:
    desc: Run ocis-groupware locally (needs GROUPWARE_OIDC_ISSUER and GROUPWARE_DATA_DIR)
    cmds:
      - go run ./cmd/ocis-groupware

  fmt:
    desc: Check gofmt formatting
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run tests with race detector and coverage
    cmds:
      - go test ./... -race -cover

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  check:
    desc: Run all checks (fmt, vet, lint, test)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  docker:build:
    desc: Build the docker image
    cmds:
      - docker build -t {{.IMAGE}} .

  docker:run:
    desc: Run the docker image, publishing :8080 (needs GROUPWARE_OIDC_ISSUER)
    cmds:
      - docker run --rm -p 8080:8080 -v groupware-data:/data -e GROUPWARE_OIDC_ISSUER {{.IMAGE}}

  stack:up:
    desc: Start oCIS, ocis-groupware and Traefik via docker compose
    cmds:
      - docker compose up -d --build

  stack:down:
    desc: Stop the compose stack (add -v to drop oCIS data)
    cmds:
      - docker compose down {{.CLI_ARGS}}

  stack:test:
    desc: Run the client flows in test/stack against the running compose stack
    cmds:
      - go test -tags stack -count=1 ./test/stack/ {{.CLI_ARGS}}
