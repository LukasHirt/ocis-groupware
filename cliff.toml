# git-cliff configuration: generate release notes from conventional commits.
# https://git-cliff.org/docs/configuration
#
# One line per squash-merge commit, grouped by type:
#   fix(auth): return 401 for an expired token (#12)
#   -> * **auth:** return 401 for an expired token ([#12](...))

[changelog]
header = ""
body = """
{%- macro entry(commit) -%}
{%- set title = commit.message | split(pat="\n") | first -%}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ title | split(pat=" (#") | first | trim }}
{%- if title is containing(" (#") -%}
{%- set number = title | split(pat=" (#") | last | trim_end_matches(pat=")") %} ([#{{ number }}](https://github.com/owncloud/ocis-groupware/pull/{{ number }}))
{%- endif -%}
{%- endmacro -%}

{% if version -%}
# Changelog for [{{ version | trim_start_matches(pat="v") }}] ({{ timestamp | date(format="%Y-%m-%d") }})
{%- else -%}
# Changelog for [unreleased]
{%- endif %}
{%- set breaking = commits | filter(attribute="breaking", value=true) %}
{%- if breaking | length > 0 %}

### Breaking Changes
{% for commit in breaking %}
{{ self::entry(commit=commit) }}
{%- endfor %}
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
{{ self::entry(commit=commit) }}
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"
sort_commits = "oldest"

# First match wins. The order of the groups is set by the HTML comment prefix.
commit_parsers = [
  { message = '^(chore|test|build|ci|docs|style|refactor)(\(.+\))?!?:', skip = true },
  { message = '^fix', group = "<!-- 1 -->Bug Fixes" },
  { message = '^feat', group = "<!-- 2 -->Features" },
  { message = '^perf', group = "<!-- 3 -->Performance" },
  { message = '^revert', group = "<!-- 4 -->Reverts" },
  { message = '.*', group = "<!-- 9 -->Miscellaneous" },
]

[bump]
initial_tag = "v0.1.0"
# Only feat, fix, perf, revert and breaking changes release anything.
no_increment_regex = "^(chore|ci|docs|test|build|refactor|style)"
