          type: string
        changeKey:
          type: string
        iCalUId:
          type: string
        type:
          type: string
          enum: [singleInstance, seriesMaster, occurrence, exception]
        seriesMasterId:
          type: string
        subject:
          type: string
        body: {$ref: "#/components/schemas/Body"}
        start: {$ref: "#/components/schemas/DateTimeZone"}
        end: {$ref: "#/components/schemas/DateTimeZone"}
