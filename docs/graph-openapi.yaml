      type: object
      properties:
        emailAddress: {$ref: "#/components/schemas/EmailAddress"}
      required: [emailAddress]
    RecurrencePattern:
      type: object
      properties:
        type:
          type: string
          enum:
            - daily
            - weekly
            - absoluteMonthly
            - relativeMonthly
            - absoluteYearly
            - relativeYearly
        interval:
          type: integer
        month:
          type: integer
        dayOfMonth:
          type: integer
        daysOfWeek:
          type: array
          items:
            type: string
            enum:
              - sunday
              - monday
              - tuesday
              - wednesday
              - thursday
              - friday
              - saturday
        firstDayOfWeek:
          type: string
        index:
          type: string
          enum: [first, second, third, fourth, last]
      required:
        - type
        - interval
        - month
        - dayOfMonth
        - daysOfWeek
        - firstDayOfWeek
        - index
    RecurrenceRange:
      type: object
      properties:
        type:
          type: string
          enum: [noEnd, endDate, numbered]
        startDate:
          type: string
        endDate:
          type: string
        recurrenceTimeZone:
          type: string
        numberOfOccurrences:
          type: integer
      required: [type, startDate, numberOfOccurrences]
    Recurrence:
      type: object
      properties:
        pattern: {$ref: "#/components/schemas/RecurrencePattern"}
        range: {$ref: "#/components/schemas/RecurrenceRange"}
      required: [pattern, range]
