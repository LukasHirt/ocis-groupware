openapi: "3.0.3"
info:
  title: "Calendar and contacts API"
  version: "1.0.0"
  description: "The Graph-shaped calendar and contacts API of the service, with a few endpoints below /groupware/v1. Every request takes the same OIDC bearer token as the rest of the service. Anything not listed answers 501 with the code notImplemented. docs/graph.md has the mapping notes."
  license:
    name: Apache-2.0
    url: "https://www.apache.org/licenses/LICENSE-2.0"
servers:
  - url: "/"
security:
  - bearer: []
tags:
  - name: Calendars
  - name: Events
  - name: "Contact folders"
  - name: Contacts
  - name: Groupware
paths:
  "/graph/v1.0/me/calendars":
    get:
      summary: "List calendars"
      tags: [Calendars]
      parameters:
        - {$ref: "#/components/parameters/top"}
        - {$ref: "#/components/parameters/skip"}
        - {$ref: "#/components/parameters/select"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CalendarPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "501": {$ref: "#/components/responses/NotImplemented"}
    post:
      summary: "Create a calendar"
      tags: [Calendars]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CalendarInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Calendar"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "501": {$ref: "#/components/responses/NotImplemented"}
  "/graph/v1.0/me/calendars/{id}":
    get:
      summary: "Get a calendar"
      tags: [Calendars]
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {$ref: "#/components/parameters/select"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Calendar"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "501": {$ref: "#/components/responses/NotImplemented"}
    patch:
