        - iCalUId
        - type
        - subject
        - body
        - start
        - end
        - isAllDay
        - isCancelled
        - showAs
        - sensitivity
        - categories
        - attendees
        - recurrence
        - location
        - isReminderOn
        - reminderMinutesBeforeStart
    EventInput:
