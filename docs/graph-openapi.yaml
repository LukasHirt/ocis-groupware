components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    top:
      name: "$top"
      in: query
      description: "Page size, 1 to 1000. Default 100."
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    skip:
      name: "$skip"
      in: query
      description: "Items to skip."
      schema:
        type: integer
        minimum: 0
    select:
      name: "$select"
      in: query
      description: "Comma-separated top-level property names. id and @odata.etag are always included."
      schema:
        type: string
    orderby:
      name: "$orderby"
      in: query
      description: "One property from the list for this resource, with an optional asc or desc."
      schema:
        type: string
    filter:
      name: "$filter"
      in: query
      description: "Conditions joined by and: start/dateTime or end/dateTime with ge, gt, le or lt and a time; subject eq, startswith(subject,'x') or contains(subject,'x')."
      schema:
        type: string
    prefer:
      name: Prefer
      in: header
      description: "outlook.timezone=\"Zone\" shows times in that zone. The answer repeats it in Preference-Applied."
      schema:
        type: string
    ifMatch:
      name: If-Match
      in: header
      description: "The ETag the client read, in weak or bare form, or *."
      schema:
        type: string
    startDateTime:
      name: startDateTime
      in: query
      required: true
      schema:
        type: string
    endDateTime:
      name: endDateTime
      in: query
      required: true
      schema:
        type: string
    id:
      name: id
      in: path
      required: true
      description: "Calendar or contact folder id."
      schema:
        type: string
    eid:
      name: eid
      in: path
      required: true
      description: "Event id, or occurrence id."
      schema:
        type: string
    cid:
      name: cid
      in: path
      required: true
      description: "Contact id."
      schema:
        type: string
    pid:
      name: pid
      in: path
      required: true
      description: "Permission id."
      schema:
        type: string
  responses:
    BadRequest:
      description: "The request is not valid."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: "There is no valid bearer token."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: "The caller may see the item but not change it."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: "The item does not exist, or it is not the caller's to see."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: "The item already exists."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    PreconditionFailed:
      description: "If-Match does not match the stored item."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotImplemented:
      description: "The path or query option is not supported."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - invalidRequest
                - unauthenticated
                - accessDenied
                - notAllowed
                - notImplemented
                - itemNotFound
                - unsupportedMediaType
                - requestEntityTooLarge
                - nameAlreadyExists
                - preconditionFailed
                - generalException
            message:
              type: string
            innerError:
              type: object
              properties:
                request-id:
                  type: string
                date:
                  type: string
                  format: date-time
              required: [request-id, date]
          required: [code, message, innerError]
      required: [error]
    EmailAddress:
      type: object
      description: "An address with a display name. Calendar owners and permission holders carry the name only."
      properties:
        name:
          type: string
        address:
          type: string
      required: [name]
    Body:
      type: object
      description: "Bodies are plain text. Writing html answers 400."
      properties:
        contentType:
          type: string
          enum: [text]
        content:
          type: string
      required: [contentType, content]
    DateTimeZone:
      type: object
      properties:
        dateTime:
          type: string
          description: "Local wall time, 2026-11-05T09:00:00.0000000. On a write the fraction is optional."
        timeZone:
          type: string
          description: "An IANA or Windows zone name. UTC when the request has no Prefer header."
      required: [dateTime, timeZone]
    Location:
      type: object
      properties:
        displayName:
          type: string
      required: [displayName]
    ResponseStatus:
      type: object
      properties:
        response:
          type: string
          enum:
            - none
            - accepted
            - tentativelyAccepted
            - declined
            - notResponded
            - organizer
        time:
          type: string
      required: [response]
    Attendee:
      type: object
      properties:
