# nginx in front of oCIS and ocis-groupware on one domain.
#
# Put the upstream next to the one for oCIS and the location blocks into the
# server block that serves oCIS. Everything not listed here keeps going to
# oCIS through that server block's existing "location /". The proxy_set_header
# lines of the server block apply to these locations as well, as long as the
# locations do not set any of their own.
#
# The regex location for the Graph paths is only reached when no "^~" prefix
# location covers /graph/. If the oCIS server block has one, add the Graph
# paths to it instead.
#
# docs/routing.md lists what each path is for.

upstream ocis_groupware {
    server 127.0.0.1:8080;
}

# Inside the oCIS server block:

    # CalDAV and CardDAV. Calendar and contact imports can be several
    # megabytes; raise client_max_body_size here if the server block's default
    # is smaller.
    location = /dav {
        proxy_pass http://ocis_groupware;
    }
    location = /dav/ {
        proxy_pass http://ocis_groupware;
    }
    location ^~ /dav/calendars/ {
        proxy_pass http://ocis_groupware;
    }
    location ^~ /dav/addressbooks/ {
        proxy_pass http://ocis_groupware;
    }
    location ^~ /dav/principals/ {
        proxy_pass http://ocis_groupware;
    }

    # Client discovery (RFC 6764).
    location = /.well-known/caldav {
        proxy_pass http://ocis_groupware;
    }
    location = /.well-known/carddav {
        proxy_pass http://ocis_groupware;
    }

    # The calendar and contacts part of the Graph API. The rest of /graph/
    # stays with oCIS.
    location ~ ^/graph/v1\.0/me/(calendar|calendars|events|contact|contacts) {
        proxy_pass http://ocis_groupware;
    }

    # The service's own API and the web app.
    location ^~ /groupware/ {
        proxy_pass http://ocis_groupware;
    }
    location ^~ /web/ {
        proxy_pass http://ocis_groupware;
    }
