{{- if .Values.legacyTokenSecret.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ocis-groupware.fullname" . }}-legacy-token
  labels:
    {{- include "ocis-groupware.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.legacyTokenSecret.key }}: {{ .Values.legacyTokenSecret.value | quote }}
{{- end }}
