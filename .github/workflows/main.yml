name: Docker CI

permissions:
  contents: read

on:
  # Merges here (including Dependabot base-image and toolchain bumps) rebuild
  # and re-push the newest release, so fixes reach the published image.
  push:
    branches: [main]
  # Deliberately unfiltered: a path filter would stop `lint` and `test` from
  # reporting on some PRs, and a check that does not always report cannot be
  # a required status check on `main`.
  pull_request:
  schedule:
    # Pick up new upstream releases.
    - cron: 0 */6 * * *
    # Weekly safety net: rebuild the newest release so base-image fixes reach
    # it even when nothing was merged here.
    - cron: 0 3 * * 0
  workflow_dispatch:
    inputs:
      rebuild-newest:
        description: Also rebuild (and re-push) the newest release
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the scripts
        run: shellcheck scripts/*.sh

      - name: Test the release resolver
        run: scripts/test-resolve-pending-releases.sh

  lint:
    uses: owncloud-docker/ubuntu/.github/workflows/lint-editorconfig.yml@master

  prepare:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      date: ${{ steps.resolve.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the releases to build
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REBUILD_INPUT: ${{ inputs.rebuild-newest }}
        # Assign first, echo second: a command substitution that fails inside
        # echo's argument does not fail the step (echo itself returns 0), so a
        # Docker Hub outage would silently emit an empty matrix and `build`
        # would die on fromJson('') instead of reporting the real error.
        run: |
          MODE="pending"
          if [ "$EVENT_NAME" = pull_request ]; then
            MODE="pr"
          elif [ "$EVENT_NAME" = push ] || [ "$EVENT_SCHEDULE" = "0 3 * * 0" ] || [ "$REBUILD_INPUT" = true ]; then
            MODE="rebuild"
          fi
          export MODE
          matrix=$(scripts/resolve-pending-releases.sh)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: [lint, prepare]
    if: needs.prepare.outputs.matrix != '[]'
    strategy:
      # Each release is scanned against its own binary; one failing leg
      # should not cancel the others.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: owncloud-docker/ubuntu/.github/workflows/docker-build-native.yml@master
    with:
      docker-repo-name: owncloud/ocis-groupware
      docker-tag: ${{ matrix.version }}
      docker-context: .
      docker-file: Dockerfile.multiarch
      docker-hub-username: ${{ vars.DOCKERHUB_USERNAME }}
      docker-build-args: |
        GIT_REF=${{ matrix.ref }}
        GIT_SHA=${{ matrix.sha }}
        VERSION=${{ matrix.version }}
        REVISION=${{ matrix.sha }}
      docker-cache-from: type=gha
      docker-cache-to: type=gha,mode=max
      trivy-ignore-files: .trivyignore
      # Only the highest release floats `latest`. The dated tag is an
      # immutable record of each (re)build, for pinning across rebuilds.
      docker-extra-tags: |
        ${{ matrix.version }}-${{ needs.prepare.outputs.date }}
        ${{ matrix.latest && 'latest' || '' }}
      # The image is distroless and has no shell, so the smoke test runs the
      # default entrypoint (no smoke-test-entrypoint-cmd). The service starts
      # without reaching its OIDC issuer, so a placeholder issuer is enough
      # for /healthz on the debug port.
      smoke-test-port: "9180"
      smoke-test-url: "http://localhost:9180/healthz"
      smoke-test-env: "GROUPWARE_OIDC_ISSUER=https://ocis.invalid"
      push: ${{ github.event_name != 'pull_request' }}
    secrets:
      docker-hub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  update-docker-hub-description:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: owncloud-docker/ubuntu/.github/workflows/docker-hub-desc.yml@master
    with:
      docker-repo-name: owncloud/ocis-groupware
      docker-repo-description: oCIS Groupware - calendar and contacts for ownCloud Infinite Scale
      docker-hub-username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      docker-hub-password: ${{ secrets.DOCKERHUB_TOKEN }}
