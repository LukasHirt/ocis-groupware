name: Check licenses

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reuse-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install reuse==6.2.0
      - run: reuse lint
