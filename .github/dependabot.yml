version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The title check requires a conventional commit with a lowercase
    # description, so the prefix is set explicitly.
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The title check requires a conventional commit with a lowercase
    # description, so the prefix is set explicitly.
    commit-message:
      prefix: chore
      include: scope
    # The ownCloud Web packages follow the Web version that oCIS ships, so
    # their updates are made by hand together with the supported versions.
    ignore:
      - dependency-name: "@ownclouders/*"
      # Their peer ranges (eslint ^9, vite up to 7) have to move first, so
      # these majors do not install until the Web packages are updated.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The title check requires a conventional commit with a lowercase
    # description, so the prefix is set explicitly.
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The title check requires a conventional commit with a lowercase
    # description, so the prefix is set explicitly.
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
